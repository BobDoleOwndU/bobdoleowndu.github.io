<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MGSV</title>

    <!--CSS Section-->
    <link href="/Content/bootstrap.min.css" rel="stylesheet" />
    <link href="/Content/bootstrap-theme.min.css" rel="stylesheet" />
    <link href="/Content/styles.css" rel="stylesheet" />

    <!--JavaScript Section-->
    <script src="/Scripts/jquery-2.1.4.min.js"></script>
    <script src="/Scripts/bootstrap.min.js"></script>
    <script>
        $(function () {
            $("#header").load("/header.html");
            $("#footer").load("/footer.html");
        });
    </script>
	
	<script>
		function packColor()
		{
			var color = document.getElementById("hex-color").value;
			
			if(color.substring(0, 1) == "#")
			{
				color = color.substring(1);
			}
			
			var colArr = Uint8Array.fromHex(color);
			var result = (colArr[0]/256) + (colArr[1]/(256**2)) + (colArr[2]/(256**3)) + ((colArr[3] ?? 255)/(256**4));
			
			document.getElementById("hex-color-output").value = result;
		}
		
		function unpackColor()
		{
			var color = document.getElementById("packed-color").value;
			var multipliers = [1.0, 256.0, 256.0 ** 2, 256.0 ** 3];
			var result = "#";
			
			for (var i = 0; i < 4; i++)
			{
				var p = color * multipliers[i];
				var frac = p - Math.floor(p);
				var byteVal = Math.floor(frac * 256.0);
				
				result += byteVal.toString(16).padStart(2, "0").toUpperCase();
			}
			
			document.getElementById("packed-color-output").value = result;
		}
	</script>
</head>
<body>
    <div id="header"></div>

    <!--Content Section-->
    <div class="container-fluid">
		<div>
			<h2>Color Packer</h2>
			<label for="hex-color">Hex Color:</label>
			<input type="text" id="hex-color" style="color:black;">
			<button class="btn btn-primary" onclick="packColor()">Pack Color</button>
			<label for="hex-color-output">Result:</label>
			<input type="text" id="hex-color-output" style="color:black;">
		</div>
		<div>
			<h2>Color Unpacker</h2>
			<label for="packed-color">Packed Color:</label>
			<input type="text" id="packed-color" style="color:black;">
			<button class="btn btn-primary" onclick="unpackColor()">Unpack Color</button>
			<label for="packed-color-output">Result:</label>
			<input type="text" id="packed-color-output" style="color:black;">
		</div>
    </div>

    <div id="footer"></div>
</body>
</html>
